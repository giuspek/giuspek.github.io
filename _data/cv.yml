cv:
  name: Giuseppe Spallitta
  label: Postdoctoral Associate in Computer Science
  location: Houston, Texas, USA
  image: ""
  summary: >
    Researcher in formal verification and automated reasoning, with a focus on
    model counting and model enumeration for SAT and SMT. Current research
    investigates the relationship between quantum computing and SAT solving in
    both directions: using SAT-based techniques for quantum verification and
    using quantum computing to optimize SAT-solving tasks.

